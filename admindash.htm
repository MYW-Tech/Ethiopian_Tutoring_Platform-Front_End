        // Add System Description
        function add_system_description(){
            description = document.getElementById('description').value;
            systemImage = document.getElementById('systemImage').files[0];

            const formData = new FormData();
            formData.append('action', 'add-system-description');
            formData.append('description', description);
            formData.append('systemImage', systemImage);

            fetch(`${api}/admindash.php`, {
                method: 'POST',
                body: formData,
            })
            .then(response => response.text())
            .then(text => {
                document.writeln('<pre>' + text + '</pre>');
            })
            .catch(e => alert(e));
        }
