<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Sign Up | EduConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3f37c9;
      --accent: #f72585;
      --dark: #2b2d42;
      --light: #f8f9fa;
      --gray: #e9ecef;
      --success: #4cc9f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .home-icon {
      position: absolute;
      top: 30px;
      left: 30px;
      color: var(--primary);
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s ease;
      z-index: 10;
    }

    .home-icon:hover {
      transform: translateX(-5px);
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 40px 30px 80px;
      text-align: center;
      position: relative;
      color: white;
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="white" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat;
      background-size: cover;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .form-container {
      padding: 30px;
      margin-top: -30px;
      position: relative;
      z-index: 3;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark);
    }

    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-container i {
      position: absolute;
      left: 15px;
      color: var(--primary);
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      padding: 14px 20px 14px 45px;
      border: 2px solid var(--gray);
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .file-upload {
      margin-top: 10px;
    }

    .file-upload-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background-color: var(--gray);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-upload-label:hover {
      background-color: #e2e6ea;
    }

    .file-upload-label i {
      color: var(--primary);
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .sign-in-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    }

    .sign-in-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #6c757d;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        max-width: 100%;
      }
      
      .header {
        padding: 30px 20px 70px;
      }
      
      .form-container {
        padding: 25px;
      }
      
      .title {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 400px) {
      .header {
        padding: 25px 15px 60px;
      }
      
      .form-container {
        padding: 20px 15px;
      }
      
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        padding: 12px 15px 12px 40px;
      }
    }
  </style>
</head>
<body>
  <a href="signup.html" class="home-icon">
    <i class="fas fa-arrow-left"></i>
  </a>

  <div class="container">
    <div class="header">
      <h2 class="title">Parent Sign Up</h2>
      <div class="wave"></div>
    </div>

    <div class="form-container">
      <div class="form-group">
        <label for="username">Full Name</label>
        <div class="input-container">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" required placeholder="Enter your full name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-container">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" required placeholder="Create a password">
        </div>
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <div class="input-container">
          <i class="fas fa-phone"></i>
          <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="Enter phone number">
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <div class="input-container">
          <i class="fas fa-map-marker-alt"></i>
          <input type="text" id="address" name="address" required placeholder="Your full address">
        </div>
      </div>

      <div class="form-group">
        <label for="profileImage">Profile Image</label>
        <div class="file-upload">
          <label class="file-upload-label">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Choose profile photo</span>
          </label>
          <input type="file" id="profileImage" name="profileImage" accept="image/*">
        </div>
      </div>

      <button type="submit" class="sign-in-btn" onclick="parentSubmit()">
        <i class="fas fa-user-plus"></i> Create Account
      </button>

      <p class="login-link">Already have an account? <a href="parent_login.html">Login here</a></p>
    </div>
  </div>

  <script src="fetching.js"></script>
</body>
</html>
