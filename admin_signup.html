<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="sign_up.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <a href="signup.html" class="home-icon">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="container">
        <div class="header">
            <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                <path fill="#4A7D99" fill-opacity="1" d="M0,128L120,138.7C240,149,480,171,720,160C960,149,1200,107,1320,85.3L1440,64V0H0Z"></path>
            </svg>
            <h2 class="title">Sign Up</h2>
        </div>

        <!-- ✅ FIXED: Added Form Tag -->
        <!-- <form id="admin-signup-form" enctype="multipart/form-data" onsubmit="return adminSubmit(event);"> -->
            <!-- Full Name -->
            <label for="admin-username">Username:</label>
            <div class="input-container">
                <i class="fas fa-user"></i>
                <input type="text" id="admin-username" name="username" required placeholder="Enter your full name">
            </div>

            <!-- Email -->
            <label for="admin-email">Email:</label>
            <div class="input-container">
                <i class="fas fa-envelope"></i>
                <input type="email" id="admin-email" name="email" required placeholder="Enter your email">
            </div>

            <!-- Password -->
            <label for="admin-password">Password:</label>
            <div class="input-container">
                <i class="fas fa-lock"></i>
                <input type="password" id="admin-password" name="password" required placeholder="Enter your password">
            </div>

            <!-- Phone Number -->
            <label for="admin-phoneNumber">Phone Number:</label>
            <div class="input-container">
                <i class="fas fa-phone"></i>
                <input type="tel" id="admin-phoneNumber" name="phone" required placeholder="Enter your phone number">
            </div>

            <!-- Profile Image -->
            <label for="admin-profileImage">Upload Profile Image:</label>
            <div class="input-container">
                <i class="fas fa-image"></i>
                <input type="file" id="admin-profileImage" name="profile">
            </div>

            <!-- ✅ FIXED: Submit Button Inside Form -->
            <button type="submit" class="sign-in-btn" onclick="adminSubmit(event)">Sign Up</button>
            <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
        <!-- </form> -->
    </div>
    <script src="request.js"></script>
</body>
</html>
