<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        .container pre {
            text-align: left;
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 300px;
        }

        .container button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .container button:hover {
            background-color: #0056b3;
        }

        .container img {
            width: 100px;
            display: none;
            border: 3px solid green;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Information</h1>
        <center><img id="user-profileImage" alt="Profile Image"></center><br>
        <p id="name"></p>
        <p id="specialization"></p>
        <pre id="userData">Loading...</pre>
        <button onclick="fetchUserData()">Fetch</button>
    </div>

    <script>
        const api_url = "http://localhost/Ethiopian_Tutoring_Platform/Ethiopian_Tutoring_Platform-Back_End/user.php";
        // Replace with your real API base URL

        function fetchUserData() {
            fetch(`${api_url}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Success:', data);

                // Always display the JSON
                document.getElementById('userData').textContent = JSON.stringify(data, null, 2);

                // Only show profile info if user is an admin
                if (data.role === 'tutor') {
                    const profileImage = document.getElementById('user-profileImage');
                    profileImage.src = data.profileImage;
                    profileImage.alt = `${data.username}'s Profile Image`;
                    profileImage.style.display = 'block';

                    const nameElement = document.getElementById('name');
                    nameElement.textContent = data.username;
                    nameElement.style.fontSize = '20px';
                    nameElement.style.fontWeight = 'bold';

                    const specialization = document.getElementById('specialization');
                    specialization.textContent = data.specialization;
                    specialization.style.fontSize = '16px';
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                document.getElementById('userData').textContent = 'Failed to fetch data. Check console for details.';
            });
        }

        // Fetch automatically on load
        fetchUserData();
    </script>
</body>
</html>
