<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Tutors JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .tutor-json {
            background: #f4f4f4;
            padding: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #2196F3;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #pagination-controls button {
            margin: 0 3px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #pagination-controls button:disabled {
            background-color: #ddd;
            cursor: default;
        }
    </style>
</head>
<body>

<h2>All Tutors (Full JSON Format)</h2>
<div id="tutors-container"></div>
<div id="pagination-controls"></div>

<script>
    const api_url = "http://localhost/Ethiopian_Tutoring_Platform/Ethiopian_Tutoring_Platform-Back_End/user.php";

    let tutorsData = [];
    let currentPage = 1;
    const tutorsPerPage = 10;

    function fetchTutors() {
        fetch(api_url, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            const tutors = Array.isArray(data) ? data : [data];
            tutorsData = tutors.filter(tutor => tutor.role === 'tutor');
            currentPage = 1;
            displayAllTutorsJSON();
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('tutors-container').innerHTML = `
                <div class="error-message">
                    <p>Failed to load tutors. Please try again later.</p>
                    <button onclick="fetchTutors()">Retry</button>
                </div>
            `;
        });
    }

    function displayAllTutorsJSON() {
        const container = document.getElementById('tutors-container');
        container.innerHTML = '';

        const startIndex = (currentPage - 1) * tutorsPerPage;
        const endIndex = startIndex + tutorsPerPage;
        const paginatedTutors = tutorsData.slice(startIndex, endIndex);

        if (paginatedTutors.length === 0) {
            container.innerHTML = '<p>No tutors found.</p>';
            return;
        }

        paginatedTutors.forEach(tutor => {
            const tutorDiv = document.createElement('div');
            tutorDiv.className = 'tutor-json';
            tutorDiv.innerHTML = `
                <pre>${JSON.stringify(tutor, null, 2)}</pre>
            `;
            container.appendChild(tutorDiv);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const totalPages = Math.ceil(tutorsData.length / tutorsPerPage);
        const controlsContainer = document.getElementById('pagination-controls');
        controlsContainer.innerHTML = '';

        for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement('button');
            button.textContent = i;
            button.disabled = i === currentPage;
            button.addEventListener('click', () => {
                currentPage = i;
                displayAllTutorsJSON();
            });
            controlsContainer.appendChild(button);
        }
    }

    // Trigger fetch on page load
    window.addEventListener('DOMContentLoaded', fetchTutors);
</script>

</body>
</html>
