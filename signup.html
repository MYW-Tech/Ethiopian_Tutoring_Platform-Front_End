<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join EduConnect | Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3f37c9;
      --accent: #f72585;
      --dark: #1a1a2e;
      --light: #f8f9fa;
      --success: #4cc9f0;
      --card-bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .home-icon {
      position: absolute;
      top: 25px;
      left: 25px;
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .home-icon:hover {
      transform: translateX(-5px);
    }

    .header .text {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .profile-icon {
      margin-top: 20px;
    }

    .profile-icon span {
      font-size: 4rem;
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      width: 100px;
      height: 100px;
      line-height: 100px;
      border-radius: 50%;
      backdrop-filter: blur(5px);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .content {
      padding: 40px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .role-btn {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    .role-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--primary);
      transform: scaleX(0);
      transition: transform 0.3s ease;
      transform-origin: left;
    }

    .role-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .role-btn:hover::before {
      transform: scaleX(1);
    }

    .role-btn i {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .role-btn a {
      text-decoration: none;
      color: var(--dark);
      font-weight: 600;
      font-size: 1.1rem;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .signup-text {
      text-align: center;
      margin-top: 40px;
      color: var(--dark);
      font-size: 1.2rem;
      font-weight: 500;
    }

    .signup-text p {
      position: relative;
      display: inline-block;
    }

    .signup-text p::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
    }

    /* Role-specific colors */
    .role-btn:nth-child(1):hover::before { background: #4361ee; } /* Tutor */
    .role-btn:nth-child(2):hover::before { background: #4cc9f0; } /* Student */
    .role-btn:nth-child(3):hover::before { background: #f72585; } /* Parent */
    .role-btn:nth-child(4):hover::before { background: #3a0ca3; } /* Admin */

    .role-btn:nth-child(1) i { color: #4361ee; }
    .role-btn:nth-child(2) i { color: #4cc9f0; }
    .role-btn:nth-child(3) i { color: #f72585; }
    .role-btn:nth-child(4) i { color: #3a0ca3; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header {
        padding: 20px;
      }
      
      .header .text {
        font-size: 1.8rem;
      }
      
      .content {
        padding: 30px 20px;
      }
      
      .buttons {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      .buttons {
        grid-template-columns: 1fr;
      }
      
      .role-btn {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="Home.html" class="home-icon">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="profile-icon">
        <i class="fas fa-user-plus"></i>
      </div>
      <p class="text">Create Your Account</p>
    </div>

    <div class="content">
      <div class="buttons">
        <button class="role-btn">
          <a href="tutor_signup.html">
            <i class="fas fa-chalkboard-teacher"></i>
            Tutor
          </a>
        </button>
        <button class="role-btn">
          <a href="student_signup.html">
            <i class="fas fa-user-graduate"></i>
            Student
          </a>
        </button>
        <button class="role-btn">
          <a href="parent_signup.html">
            <i class="fas fa-users"></i>
            Parent
          </a>
        </button>
        <button class="role-btn">
          <a href="admin_signup.html">
            <i class="fas fa-user-shield"></i>
            Admin
          </a>
        </button>
      </div>

      <div class="signup-text">
        <p>Select your role to continue</p>
      </div>
    </div>
  </div>
</body>
</html>
