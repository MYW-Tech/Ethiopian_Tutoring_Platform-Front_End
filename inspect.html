<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Tutor | Find a Tutor Near You</title>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- JavaScript -->
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="container">
            <div class="logo">Success Tutor</div>
            <nav>
                <ul>
                    <li><a href="#">Find a Tutor</a></li>
                    <li><a href="#">How It Works</a></li>
                    <li><a href="#">Sign Up</a></li>
                    <li><a href="#">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Find the Best Tutors for Your Child</h1>
            <p>Browse trusted, verified tutors near you. Connect and book sessions instantly.</p>
            
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search for subjects, location...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </section>

    <!-- Tutor Listings -->
    <section class="tutor-list">
        <h2>Available Tutors</h2>
        <div class="tutor-container" id="tutor-container">
            <!-- Tutor profiles will be injected here via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Success Tutor. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
