<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Registration | EduConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #4A7D99;
            --primary-light: #6D9DB8;
            --secondary: #FF7E5F;
            --dark: #2D3748;
            --light: #F7FAFC;
            --gray: #E2E8F0;
            --success: #48BB78;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            position: relative;
            margin-bottom: 1rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i {
            position: absolute;
            left: 12px;
            color: var(--primary);
        }

        .input-container input,
        .input-container textarea,
        .input-container select {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid var(--gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-container input:focus,
        .input-container textarea:focus,
        .input-container select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 125, 153, 0.2);
        }

        .input-container textarea {
            min-height: 100px;
            resize: vertical;
        }

        .input-container input[type="file"] {
            padding: 10px 16px 10px 40px;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .radio-option input {
            width: auto;
        }

        .sign-in-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .sign-in-btn:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            color: #718096;
            margin-top: 1rem;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--primary);
            font-size: 1.2rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            color: var(--primary-light);
        }

        .illustration {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .illustration img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }

            .illustration {
                display: none;
            }
        }

        /* Custom file input */
        .file-input-container {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-button {
            border: 2px solid var(--gray);
            border-radius: 8px;
            padding: 10px 16px;
            background-color: white;
            color: var(--dark);
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-button:hover {
            border-color: var(--primary);
        }

        .file-input-container input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Time and day inputs */
        .time-day-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Success message */
        .success-message {
            background-color: rgba(72, 187, 120, 0.1);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <a href="signup.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> 
    </a>

    <div class="container">
        <div class="header">
            <h1>Join as a Tutor</h1>
            <p>Share your knowledge and connect with students worldwide</p>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="tutor-name" name="username" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="tutor-email" name="email" required placeholder="john@example.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="tutor-password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-container">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="tutor-phoneNumber" name="phone" required placeholder="+251 900 000 000">
                </div>
            </div>

            <div class="form-group">
                <label for="specialization">Specialization</label>
                <div class="input-container">
                    <i class="fas fa-book"></i>
                    <input type="text" id="tutor-specialization" name="specialization" required placeholder="Mathematics, Physics, etc.">
                </div>
            </div>

            <div class="form-group">
                <label for="experienceYear">Years of Experience</label>
                <div class="input-container">
                    <i class="fas fa-calendar"></i>
                    <input type="number" id="tutor-experienceYear" name="experienceYear" required placeholder="3">
                </div>
            </div>

            <div class="form-group">
                <label for="bio">Professional Bio</label>
                <div class="input-container">
                    <i class="fas fa-user-edit"></i>
                    <textarea id="tutor-bio" name="bio" required placeholder="Tell us about your teaching experience and approach..."></textarea>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="female" required>
                        <label for="female">Female</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="school">School/Institution</label>
                <div class="input-container">
                    <i class="fas fa-school"></i>
                    <input type="text" id="tutor-school" name="school" required placeholder="Addis Ababa University">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <div class="input-container">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="tutor-address" name="address" required placeholder="Bole, Addis Ababa">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Hourly Rate (ETB)</label>
                <div class="input-container">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" id="tutor-feeAmount" name="amount" required placeholder="300">
                </div>
            </div>

            <div class="time-day-container">
                <div class="form-group">
                    <label for="address">Available Time</label>
                    <div class="input-container">
                        <i class="fas fa-clock"></i>
                        <input type="text" id="tutor-time" name="time" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Days</label>
                    <div class="input-container">
                        <i class="fas fa-day"></i>
                        <input type="text" id="tutor-day" name="day" required placeholder="Monday, Tuesday...">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="profile">Profile Photo</label>
                <div class="file-input-container">
                    <div class="file-input-button">
                        <i class="fas fa-image"></i>
                        <span>Choose file</span>
                    </div>
                    <input type="file" id="tutor-profile" name="profileImage" accept="image/*">
                </div>
            </div>

            <button type="submit" class="sign-in-btn" onclick="tutorSubmit()">
                <i class="fas fa-user-plus"></i> Complete Registration
            </button>

            

            <p class="login-link">Already have an account? <a href="tutor_login.html">Login here</a></p>
        </div>
    </div>
    <script src="fetching.js"></script>

</body>
</html>
