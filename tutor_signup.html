<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="sign_up.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <a href="signup.html" class="home-icon">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="container">
        <div class="header">
            <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                <path fill="#4A7D99" fill-opacity="1" d="M0,128L120,138.7C240,149,480,171,720,160C960,149,1200,107,1320,85.3L1440,64V0H0Z"></path>
            </svg>
            <h2 class="title">Sign Up</h2>
        </div>
        <h1><br></h1>
        <h1><br></h1>
        <h1><br></h1>
            <label for="name">Username:</label>
            <div class="input-container">
                <i class="fas fa-user"></i>
                <input type="text" id="tutor-name" name="username" required placeholder="Enter your username">
            </div>
        
            <label for="email">Email:</label>
            <div class="input-container">
                <i class="fas fa-envelope"></i>
                <input type="email" id="tutor-email" name="email" required placeholder="Enter your email">
            </div>
        
            <label for="password">Password:</label>
            <div class="input-container">
                <i class="fas fa-lock"></i>
                <input type="password" id="tutor-password" name="password" required placeholder="Enter your password">
            </div>
        
            <label for="phone">Phone Number:</label>
            <div class="input-container">
                <i class="fas fa-phone"></i>
                <input type="tel" id="tutor-phoneNumber" name="phone" required placeholder="Enter your phone number">
            </div>
        
            <label for="specialization">Specialization:</label>
            <div class="input-container">
                <i class="fas fa-book"></i>
                <input type="text" id="tutor-specialization" name="specialization" required placeholder="Enter your specialization">
            </div>
        
            <label for="experienceYear">Experience (Years):</label>
            <div class="input-container">
                <i class="fas fa-calendar"></i>
                <input type="number" id="tutor-experienceYear" name="experienceYear" required placeholder="Enter years of experience">
            </div>
        
            <label for="bio">Bio:</label>
            <div class="input-container">
                <i class="fas fa-user-edit"></i>
                <textarea id="tutor-bio" name="bio" required placeholder="Write a short bio"></textarea>
            </div>
        
            <label for="gender">Sex:</label>
            <input type="radio" name="gender" value="male" required>Male
            <input type="radio" name="gender" value="female" required>Female<br>
        
            <label for="school">School Name:</label>
            <div class="input-container">
                <i class="fas fa-school"></i>
                <input type="text" id="tutor-school" name="school" required placeholder="Enter your school name">
            </div>
        
            <label for="address">Address:</label>
            <div class="input-container">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="tutor-address" name="address" required placeholder="Enter your address">
            </div>
            <!-- fee amount -->
            <label for="address">Fee Amount:</label>
            <div class="input-container">
                <i class="fas fa-dollar"></i>
                <input type="text" id="tutor-feeAmount" name="amount" required placeholder="Enter your address">
            </div>
            <!-- Tutor Time -->
            <label for="address">Tutor Time:</label>
            <div class="input-container">
                <i class="fas fa-time"></i>
                <input type="text" id="tutor-time" name="time" required placeholder="Enter your address">
            </div>
           
            <!-- tutor Day -->
            <label for="address">Tutor Day:</label>
            <div class="input-container">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="tutor-day" name="day" required placeholder="Enter your address">
            </div>
        
            <label for="profile">Upload Profile Image:</label>
            <div class="input-container">
                <i class="fas fa-image"></i>
                <input type="file" id="tutor-profile" name="profileImage">
            </div>
        
            <button type="submit" class="sign-in-btn" onclick="tutorSubmit()">Sign Up</button>
            <p class="login-link">Already have an account? <a href="#">Login</a></p>
      
         </div>
    <script src="request.js"></script>
</body>
</html>
