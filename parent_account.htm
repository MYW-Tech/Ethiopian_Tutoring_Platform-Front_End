<h1>Register</h1>
<input type="text" id="username" placeholder="Name"><br>
<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<input type="text" id="phoneNumber" placeholder="Phone"><br>
<input type="text" id="address" placeholder="Address"><br>
<input type="file" id="profileImage" placeholder="Profile Image" accept="images/*"><br>
<button onclick="signup()">Register</button>

<h1>Login</h1>
<input type="email" id="login-email" placeholder="Email"><br>
<input type="password" id="login-password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<h1>Logout</h1>
<button onclick="logout()">Logout</button>

<h1>Information</h1>
<button onclick="info()">Information</button>

<h1><hr></h1>

<script type="text/javascript">
const api_base_url = "http://localhost/Ethiopian_Tutoring_Platform/Ethiopian_Tutoring_Platform-Back_End";

function signup() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const phoneNumber= document.getElementById('phoneNumber').value;
        const address = document.getElementById('address').value;
        const profileImage = document.getElementById('profileImage').files[0];

        const formData = new FormData();
        formData.append('username', username);
        formData.append('email', email);
        formData.append('password', password);
        formData.append('phoneNumber', phoneNumber);
        formData.append('address', address);
        formData.append('profileImage', profileImage);
        formData.append('action', 'signup_for_parent');

        const url = `${api_base_url}/myw.tutor.api.php`;
        fetch(url, {
                method: 'POST',
                body: formData,
            })
        .then(response => response.text())
        .then(data => {
            const resultContainer = document.createElement('div');
            resultContainer.textContent = JSON.stringify(data, null, 2);
            document.body.appendChild(resultContainer);
            // Process the data as needed
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }

    function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const formData = new FormData();
        formData.append('email', email);
        formData.append('password', password);
        formData.append('action', 'login_for_parent');

        const url = `${api_base_url}/myw.tutor.api.php`;
        fetch(url, {
                method: 'POST',
                body: formData,
            })
        .then(response => response.text())
        .then(data => {
            const resultContainer = document.createElement('div');
            resultContainer.textContent = JSON.stringify(data, null, 2);
            document.body.appendChild(resultContainer);
            // Process the data as needed
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }

    function logout() {
        const input = {
            "action": "logout"
        };

        const url = `${api_base_url}/myw.tutor.api.php?${new URLSearchParams(input)}`; 
        fetch(url)
            .then(response => response.text())
            .then(data => {
                const resultContainer = document.createElement('div');
                resultContainer.textContent = JSON.stringify(data, null, 2);
                document.body.appendChild(resultContainer);
                // Process the data as needed
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    function info() {
        const input = {
            "action" : "current_user",
        };

        const url = `${api_base_url}/myw.tutor.api.php?${new URLSearchParams(input)}`; 
        fetch(url)
            .then(response => response.text())
            .then(data => {
                const resultContainer = document.createElement('div');
                resultContainer.textContent = JSON.stringify(data, null, 2);
                document.body.appendChild(resultContainer);
                // Process the data as needed
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
