<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
          box-sizing: border-box;
        }
    
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(120deg, #2c3e50, #3498db);
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
        }
    
        .login-wrapper {
          background-color: #fff;
          padding: 40px 30px;
          border-radius: 12px;
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
          width: 100%;
          max-width: 400px;
          animation: fadeIn 0.8s ease-in-out;
        }
    
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
    
        h2 {
          text-align: center;
          margin-bottom: 25px;
          color: #2c3e50;
        }
    
        input,
        select,
        button {
          width: 100%;
          padding: 12px;
          margin-top: 10px;
          border: 1px solid #ccc;
          border-radius: 6px;
          font-size: 1rem;
        }
    
        input:focus,
        select:focus {
          outline: none;
          border-color: #3498db;
          box-shadow: 0 0 4px rgba(52, 152, 219, 0.4);
        }
    
        button {
          background-color: #3498db;
          color: white;
          font-weight: bold;
          border: none;
          transition: background-color 0.3s ease;
          margin-top: 20px;
        }
    
        button:hover {
          background-color: #2980b9;
        }
    
        .select-wrapper {
          margin-top: 10px;
        }
    
        .footer {
          text-align: center;
          margin-top: 20px;
          font-size: 0.9rem;
          color: #777;
        }
    
        @media (max-width: 768px) {
          .login-wrapper {
            padding: 30px 20px;
          }
        }
      </style>
</head>
<body>
  <div class="container">
    <form class="login-wrapper" id="login-form">
        <h2>Login</h2>
        <input type="email" name="email" id="email" placeholder="Email..." required><br>
        <input type="password" name="password" id="password" placeholder="Password..." required><br>
        <button type="submit">Submit</button>
    </form>
</div>


<script>
  const api_base_url = "http://localhost/Ethiopian_Tutoring_Platform/Ethiopian_Tutoring_Platform-Back_End";

  document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault(); // Prevent form from submitting the default way

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);
      formData.append('action', 'login_for_tutor');

      const url = `${api_base_url}/myw.tutor.api.php`;

      fetch(url, {
          method: 'POST',
          body: formData,
      })
      .then(response => response.json())
      .then(data => {
    console.log("Login Response:", data);

    if (data.status === "ok" || data.success === true) {
        window.location.href = "dashboard/parent.html";
    } else if (data.data === "Sorry, you are already logged in!") {
        // Already logged in? Go to dashboard anyway
        window.location.href = "dashboard/tutor.html";
    } else {
        alert("Login failed: " + (data.data || "Unknown error"));
    }
})

      .catch(error => {
          console.error('Error:', error);
          alert("An error occurred while trying to log in.");
      });
  });
</script>


</body>
</html>
